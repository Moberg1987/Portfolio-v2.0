name: Test FTP connection

on:
  workflow_dispatch:

jobs:
  test-ftp:
    runs-on: ubuntu-latest

    steps:
      - name: Check FTP connection and site directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from ftplib import FTP_TLS

          ftp = FTP_TLS()
          ftp.connect(os.environ["FTP_SERVER"], 21, timeout=20)
          ftp.login(
              os.environ["FTP_USER"],
              os.environ["FTP_PASSWORD"]
          )
          ftp.prot_p()

          print("Secure FTP connection successful")

          site_dir = "/www/barbarov.site/"
          ftp.cwd(site_dir)

          files = ftp.nlst()
          print("Site directory:", ftp.pwd())
          print("Site files:", files)

          if "index.html" in [f.rstrip("/").split("/")[-1] for f in files]:
              print("SUCCESS: index.html found!")
          else:
              raise Exception("index.html not found!")

          ftp.quit()
          PY
