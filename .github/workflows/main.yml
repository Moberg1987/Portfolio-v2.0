name: Test FTP connection

on:
  workflow_dispatch:

jobs:
  test-ftp:
    runs-on: ubuntu-latest

    steps:
      - name: Check FTP connection and directories
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from ftplib import FTP_TLS

          ftp = FTP_TLS()
          ftp.connect(os.environ["FTP_SERVER"], 21, timeout=20)
          ftp.login(
              os.environ["FTP_USER"],
              os.environ["FTP_PASSWORD"]
          )
          ftp.prot_p()

          print("Secure FTP connection successful")
          print("FTP current directory:", ftp.pwd())
          print("FTP root contents:", ftp.nlst())

          ftp.quit()
          PY
